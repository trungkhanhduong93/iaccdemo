# Robot kiểm code rồi đưa bản phát hành lên Cloudflare Pages i-accounting. Giải thích ở docs/TRIEN-KHAI.md.
# Sửa file này phải được Trum đồng ý (AGENTS.md, mục Cấm).
name: Phát hành lên i-accounting

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: i-accounting-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  phat-hanh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Cài thư viện
        run: npm ci

      - name: Kiểm kiểu TypeScript
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Đưa lên Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy dist --project-name i-accounting --branch main

      - name: Báo Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KET_QUA: ${{ job.status }}
          LINK_CHAY: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 tools/bao_telegram.py "$GITHUB_EVENT_PATH"
