# Robot kiểm code rồi đưa iaccdemo lên Cloudflare Pages. Giải thích ở docs/TRIEN-KHAI.md.
# Sửa file này phải được Trum đồng ý (AGENTS.md, mục Cấm).
name: Kiểm và đưa lên iaccdemo

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

# Chạy lần lượt; lần đang chờ bị thay bằng lần push mới hơn
concurrency:
  group: iaccdemo-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  kiem-va-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CO_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Cài thư viện
        run: npm ci

      - name: Kiểm kiểu TypeScript
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Token chỉ đưa vào đúng bước này, các bước cài thư viện không thấy token
      - name: Đưa lên Cloudflare Pages
        if: env.CO_TOKEN == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy dist --project-name iaccdemo --branch main

      - name: Chưa có token thì chỉ kiểm
        if: env.CO_TOKEN != 'true'
        run: echo "::warning::Chưa có secret CLOUDFLARE_API_TOKEN nên robot chỉ kiểm và build, không đưa lên online. Cách tạo token ở docs/TRIEN-KHAI.md."
